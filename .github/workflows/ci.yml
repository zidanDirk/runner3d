name: Verify release and committed assets

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-release-gate
          path: artifacts/beta-release/gate/report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-browser-failures
          path: test-results/task14/gate-core/
          retention-days: 14
  visual-comparison:
    # Human-approved separate references. Original 91 PNGs remain byte-identical.
    # Unknown hosts/images fail closed; no future diff is accepted automatically.
    runs-on: macos-26
    env:
      RUNNER3D_VISUAL_PLATFORM: github-macos-26
    # Leave time to upload actual/diff evidence even when software rendering is slow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Record public host facts before the fail-closed visual gate
        run: node scripts/visual/candidate.mjs observe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-host-observation
          path: artifacts/visual-environment/host.json
          retention-days: 14
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify all original and approved platform reference hashes
        run: npm run visual:validate
      - name: Record real font and renderer provenance before the full comparison
        run: npx playwright test tests/e2e/00-visual-provenance.spec.ts --output=test-results/visual-provenance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-environment-before
          path: test-results/visual-provenance/**/visual-provenance.json
          retention-days: 14
      - name: Match the original baseline's Apple system font
        run: swift scripts/release/ensure-ci-font.swift --download-system-font
        timeout-minutes: 3
      - name: Record the matched comparison environment
        run: npx playwright test tests/e2e/00-visual-provenance.spec.ts --output=test-results/visual-provenance-after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-environment
          path: test-results/visual-provenance-after/**/visual-provenance.json
          retention-days: 14
      # Never --update-snapshots. A failure requires actual/diff review.
      - run: npm run test:visual
        timeout-minutes: 38
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-failures
          # Keep images small enough to review on ordinary connections. Traces
          # remain available separately; neither artifact updates the baselines.
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
            test-results/**/.last-run.json
            test-results/**/visual-provenance.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-traces
          path: test-results/**/trace.zip
          retention-days: 14

name: Approve Qiniu production or rollback

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Reviewed Qiniu Beta candidate workflow run ID
        required: true
      build_id:
        description: Exact reviewed production build ID
        required: true
      previous_build:
        description: Current stable build ID (none only for first launch)
        required: true
      confirm:
        description: Type PROMOTE followed by a space and the exact build ID
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: reviewed-qiniu-release
  cancel-in-progress: false

jobs:
  identity:
    timeout-minutes: 5
    if: inputs.confirm == format('PROMOTE {0}', inputs.build_id)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          if (!/^\d+$/.test(process.env.SOURCE_RUN)) throw new Error('Invalid source run ID');
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
          if (!response.ok) throw new Error('Cannot read candidate workflow run');
          const run = await response.json();
          if (run.name !== 'Reviewed Qiniu Beta candidate' || run.conclusion !== 'success' || !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Source is not a successful candidate workflow');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\n`);
          JS
  promote:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure Required reviewers + Prevent self-review before adding production secrets.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-release
          path: .
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Match reviewed artifact identity
        env:
          EXPECTED_BUILD: ${{ inputs.build_id }}
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/release.json'));if(r.buildId!==process.env.EXPECTED_BUILD||r.environment!=='production')throw new Error('Wrong reviewed production artifact');"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recheck immutable candidate before changing the entry
        run: node scripts/release/remote-smoke.mjs "$RELEASE_TEST_URL" "$RELEASE_BUILD_ID"
        env:
          RELEASE_TEST_URL: ${{ vars.RELEASE_BASE_URL }}releases/${{ inputs.build_id }}/
          RELEASE_BUILD_ID: ${{ inputs.build_id }}
      - run: npm run test:release
        env:
          RELEASE_TEST_URL: ${{ vars.RELEASE_BASE_URL }}releases/${{ inputs.build_id }}/
      - run: bash scripts/release/install-qshell.sh
      - run: node scripts/release/qiniu.mjs promote --execute
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          RELEASE_CONFIRM: PROMOTE ${{ inputs.build_id }}
          RELEASE_PREVIOUS_BUILD: ${{ inputs.previous_build }}
          RELEASE_APPROVAL_CONFIGURED: ${{ vars.RELEASE_APPROVAL_CONFIGURED }}

name: Build and deploy H5 game to Qiniu

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-qiniu-master
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed assets and game
        run: |
          npm run assets:config
          npm run assets:validate
          npm test

      - name: Build H5 game
        run: npm run build

      - name: Install Qshell
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output qshell.tar.gz \
            https://github.com/qiniu/qshell/releases/download/v2.19.12/qshell-v2.19.12-linux-amd64.tar.gz
          echo '19edaf7337f08609d2570b6e1337ca5a912bfe45155133a6b7fc66efa53bf965  qshell.tar.gz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/qshell-bin"
          tar -xzf qshell.tar.gz -C "$RUNNER_TEMP/qshell-bin" qshell
          echo "$RUNNER_TEMP/qshell-bin" >> "$GITHUB_PATH"

      - name: Upload to Qiniu Kodo
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET || secrets.QINIU_BUCKET }}
        run: |
          set -euo pipefail
          if [[ -z "$QINIU_AK" || -z "$QINIU_SK" || -z "$QINIU_BUCKET" ]]; then
            echo 'Configure QINIU_AK and QINIU_SK as secrets, and QINIU_BUCKET as a variable or secret.' >&2
            exit 1
          fi
          qshell account -- "$QINIU_AK" "$QINIU_SK" qiniu-deploy-user
          qshell qupload2 \
            --src-dir=dist \
            --bucket="$QINIU_BUCKET" \
            --key-prefix=runner/ \
            --overwrite \
            --rescan-local \
            --skip-fixed-strings=.DS_Store

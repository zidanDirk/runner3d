name: Reviewed Qiniu Beta candidate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Public build environment (promotion uses a separate manual workflow)
        type: choice
        options: [preview, production]
        default: preview
      confirm_upload:
        description: Type UPLOAD REVIEWED CANDIDATE to authorize a new immutable public candidate
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: reviewed-qiniu-release
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirm_upload == 'UPLOAD REVIEWED CANDIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
    env:
      RELEASE_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require successful full CI for this exact candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { verifyCandidateCI } from './scripts/release/preflight.mjs';
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
          if (!response.ok) throw new Error('Cannot verify candidate CI');
          const data = await response.json();
          console.log(verifyCandidateCI(data.workflow_runs, process.env.EXPECTED_COMMIT));
          JS
      - run: npm run release:check
      - id: identity
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/release.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'build_id='+r.buildId+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-release
          path: |
            dist/
            artifacts/beta-release/gate/report.json
          retention-days: 30
  candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-release
          path: .
      - run: bash scripts/release/install-qshell.sh
      - run: node scripts/release/qiniu.mjs upload --execute
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          RELEASE_CONFIRM: UPLOAD ${{ needs.verify.outputs.build_id }}
      - run: node scripts/release/remote-smoke.mjs "$RELEASE_TEST_URL" "$RELEASE_BUILD_ID" "$RELEASE_EXPECTED_COMMIT"
        env:
          RELEASE_TEST_URL: ${{ vars.RELEASE_BASE_URL }}releases/${{ needs.verify.outputs.build_id }}/
          RELEASE_BUILD_ID: ${{ needs.verify.outputs.build_id }}
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
        env:
          RELEASE_TEST_URL: ${{ vars.RELEASE_BASE_URL }}releases/${{ needs.verify.outputs.build_id }}/

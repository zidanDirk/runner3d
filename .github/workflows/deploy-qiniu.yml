name: Reviewed Qiniu Beta candidate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Preview only until real Preview verification and a separately reviewed Production enablement
        type: choice
        options: [preview]
        default: preview
      confirm_upload:
        description: New upload UPLOAD REVIEWED CANDIDATE; resume RESUME <BuildID> <original manifest SHA256>
        required: true
      resume_source_run_id:
        description: Optional completed original candidate run, at this SAME source SHA; empty for NEW
        default: ''
      resume_build_id:
        description: Exact original BuildID for resume; empty for NEW
        default: ''
      resume_manifest_sha256:
        description: Exact original release-manifest SHA256 for resume; empty for NEW
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: reviewed-qiniu-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_id: ${{ steps.identity.outputs.build_id }}
    env:
      RELEASE_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
          cache: npm
      - name: Validate explicit new/resume authorization before any artifact or cloud operation
        env:
          SELECTED_ENV: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirm_upload }}
          SOURCE_RUN: ${{ inputs.resume_source_run_id }}
          EXPECTED_BUILD: ${{ inputs.resume_build_id }}
          EXPECTED_MANIFEST: ${{ inputs.resume_manifest_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import { candidateInputs } from './scripts/release/candidate.mjs';
          console.log(candidateInputs({ environment: process.env.SELECTED_ENV, confirmation: process.env.CONFIRMATION, sourceRun: process.env.SOURCE_RUN, buildId: process.env.EXPECTED_BUILD, manifestSha256: process.env.EXPECTED_MANIFEST }));
          JS
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require successful full CI for this exact candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { verifyCandidateCI } from './scripts/release/preflight.mjs';
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } });
          if (!response.ok) throw new Error('Cannot verify candidate CI');
          const data = await response.json();
          console.log(verifyCandidateCI(data.workflow_runs, process.env.EXPECTED_COMMIT));
          JS
      - name: Check original resume run repository, workflow and exact source SHA
        if: inputs.resume_source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.resume_source_run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { verifyResumeSource } from './scripts/release/candidate.mjs';
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/runs/${process.env.SOURCE_RUN}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }, redirect: 'error', signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error('Cannot verify original candidate run');
          verifyResumeSource(await response.json(), process.env.REPOSITORY, process.env.EXPECTED_COMMIT, process.env.SOURCE_RUN);
          JS
      - uses: actions/download-artifact@v4
        if: inputs.resume_source_run_id != ''
        with:
          name: reviewed-release
          path: .
          run-id: ${{ inputs.resume_source_run_id }}
          github-token: ${{ github.token }}
      - name: Validate restored exact artifact and passed gate without rebuilding
        if: inputs.resume_source_run_id != ''
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_BUILD: ${{ inputs.resume_build_id }}
          EXPECTED_MANIFEST: ${{ inputs.resume_manifest_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import { verifyResumeArtifact } from './scripts/release/candidate.mjs';
          await verifyResumeArtifact({ environment: process.env.RELEASE_ENV, expectedCommit: process.env.EXPECTED_COMMIT, buildId: process.env.EXPECTED_BUILD, manifestSha256: process.env.EXPECTED_MANIFEST });
          JS
      - run: npm run release:check
        if: inputs.resume_source_run_id == ''
      - id: identity
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/release.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'build_id='+r.buildId+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-release
          path: |
            dist/
            artifacts/beta-release/gate/report.json
          retention-days: 30
  candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Production candidate uploads remain closed pending real Preview evidence.
    # Enabling them requires a separate reviewed change; promotion stays separate.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.17.0'
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-release
          path: .
      - name: Upload new candidate or explicitly resume the exact original artifact
        env:
          RESUME_SOURCE_RUN: ${{ inputs.resume_source_run_id }}
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          RELEASE_CONFIRM: ${{ inputs.resume_source_run_id != '' && format('RESUME {0} {1}', needs.verify.outputs.build_id, inputs.resume_manifest_sha256) || format('UPLOAD {0}', needs.verify.outputs.build_id) }}
          RELEASE_ENV: ${{ inputs.environment }}
        run: |
          if [ -n "$RESUME_SOURCE_RUN" ]; then
            node scripts/release/qiniu.mjs upload --execute --resume
          else
            node scripts/release/qiniu.mjs upload --execute
          fi
      - name: Retain sanitized immutable upload receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-upload-receipt
          path: artifacts/beta-release/uploads/*.json
          retention-days: 30
      - run: node scripts/release/remote-smoke.mjs "$RELEASE_TEST_URL" "$RELEASE_BUILD_ID" "$RELEASE_EXPECTED_COMMIT"
        env:
          RELEASE_TEST_URL: ${{ vars.RELEASE_BASE_URL }}releases/${{ needs.verify.outputs.build_id }}/
          RELEASE_BUILD_ID: ${{ needs.verify.outputs.build_id }}
          RELEASE_EXPECTED_COMMIT: ${{ github.sha }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
        env:
          RELEASE_TEST_URL: ${{ vars.RELEASE_BASE_URL }}releases/${{ needs.verify.outputs.build_id }}/
